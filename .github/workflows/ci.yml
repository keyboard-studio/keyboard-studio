# CI — typecheck / lint / test / build for the monorepo. See #2.
# Minimal-by-design: matches what `pnpm test`/`pnpm build`/`pnpm lint` do locally.
# Extend later (coverage, matrix across Node versions) as the package set grows.

name: CI

# `pull_request` covers `dev` as well as `main` so the stacked feature branches
# that integrate through `dev` are not merged unverified. Without `dev` here a
# PR into it reported only the Vercel preview and the project-board sync —
# neither runs a test — so the first real build of that code was whenever
# `dev` -> `main` landed, long after the change.
#
# `push` stays main-only on purpose: a `pull_request` run checks out the merge
# of head into base, so the PR run already validates the integrated result and
# a post-merge `push` run on `dev` would re-test the same tree.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Cancel a superseded run when a newer commit lands on the same ref, so a
# rapid second push doesn't leave the first full run burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned commit of keyboard-studio/keyboards (master) that the corpus-gated
  # tests run against — see the corpus checkout step.
  KEYBOARDS_CORPUS_SHA: 435f82d69bfc926eb03c2d8632571b41b6da3266

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The corpus-gated unit tests (codec round-trip, carveViaSplice corpus
      # sweep, recognizer integration, touch fixtures, facet-index real-corpus
      # slice, ...) look for a sibling `../keyboards` clone next to the repo
      # root and `skipIf` it is absent — so without this step ~55 of them
      # silently skip on every run. Same sparse + shallow inputs as
      # supportability-scan.yml, but PINNED to one commit of the
      # keyboard-studio/keyboards fork so CI tests one known corpus rather
      # than whatever master is today. Bump KEYBOARDS_CORPUS_SHA deliberately
      # (and re-run the corpus tests locally against it) when the fork moves.
      - name: Checkout keyboard-studio/keyboards corpus (pinned, release/ only, shallow)
        uses: actions/checkout@v4
        with:
          repository: keyboard-studio/keyboards
          ref: ${{ env.KEYBOARDS_CORPUS_SHA }}
          path: .keyboards
          fetch-depth: 1
          sparse-checkout: release
          sparse-checkout-cone-mode: true
          persist-credentials: false

      # actions/checkout can only write inside the workspace, so move the tree
      # to the sibling path the tests resolve (`<repo>/../keyboards`). Moving
      # (not symlinking) keeps it out of the workspace, so no repo-wide walker
      # (lint, depcruise, vitest globs) ever sees 900 foreign keyboards.
      # KEYBOARDS_REPO points the studio postbuild (build-keyboards-index.mjs)
      # and vite.config.ts at the same pinned tree, so the build no longer
      # clones keyboards master into node_modules/.cache on every run.
      - name: Place corpus at ../keyboards
        run: |
          corpus="$(dirname "$GITHUB_WORKSPACE")/keyboards"
          mv "$GITHUB_WORKSPACE/.keyboards" "$corpus"
          echo "KEYBOARDS_REPO=$corpus" >> "$GITHUB_ENV"

      - name: Set up pnpm
        # Version comes from package.json "packageManager" (pnpm@9.12.0).
        # Don't also set `version` here -- action-setup@v4 errors on a conflict.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Single pin shared with local dev. A floating "22" resolves to the
          # newest 22.x here while a dev box can sit on an older patch --
          # @lingui/cli needs >= 22.19.0 and no-ops silently below it.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Offline codegen the build depends on. Most prebuild steps fetch over
      # the network (langtags/glottolog) and commit their derived index, so CI
      # skips them. Two exceptions run here, for different reasons: this one
      # because it is hermetic and the build needs it, and fetch-sldr below
      # because a test needs its raw input even though the derived index is
      # committed — see that step's own comment.
      #
      # codegen-charnames derives from the committed, SHA-pinned
      # lib/ucd/UnicodeData.txt into a gitignored JSON that
      # engine/src/character-discovery/charNames.ts imports at build time.
      # Regenerate it here — hermetic, no network — so `pnpm -r build` resolves.
      - name: Codegen (charnames — offline, build input)
        run: pnpm run codegen-charnames

      # The exemplar index (exemplars.generated.json) IS committed, so neither
      # the build nor the app needs the raw SLDR tree. But the spec 044
      # determinism test regenerates the index from source and asserts it
      # reproduces the committed artifact byte for byte — that regeneration
      # reads packages/engine/data/sldr/sldr/, which is gitignored. Without
      # this step the test fails on every run with "not found — run
      # `pnpm run fetch-sldr` first", and the guarantee that a pin bump can't
      # silently change the index goes unenforced. Commit + tarball SHA-256 are
      # pinned in scripts/sldr-version.json and the script fails loudly on a
      # mismatch, so the fetch is reproducible despite touching the network.
      # Cache the extracted SLDR locale tree, keyed on the pinned version file
      # (scripts/sldr-version.json holds the commit + tarball SHA-256). On the
      # common path the pin is unchanged, so the extract is restored and the
      # download below is skipped. When the pin is bumped the version file
      # changes, the key misses, and fetch-sldr re-downloads and re-verifies the
      # SHA-256 — so the checksum guarantee is preserved: any change to what we
      # fetch invalidates the cache and forces a fresh verified fetch.
      - name: Cache SLDR extract
        id: sldr-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/data/sldr/sldr
          key: sldr-${{ hashFiles('scripts/sldr-version.json') }}

      - name: Fetch SLDR (pinned — determinism-test input)
        if: steps.sldr-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch-sldr

      # Build before typecheck — engine/studio depend on contracts'
      # dist/*.d.ts at type-resolution time. Without this, downstream
      # typechecks fail with "Cannot find module '@keyboard-studio/contracts'"
      # and trigger cascade errors (e.g. switch-exhaustiveness loss
      # because LintFinding["severity"] degrades to any).
      - name: Build (all packages)
        run: pnpm -r build

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Lint (eslint + depcruise + crew-lint + facet-lint)
        run: pnpm lint

      - name: Test (all packages)
        run: pnpm -r test

      # The co-located Vercel functions under /api are intentionally outside the
      # pnpm workspace, so `pnpm -r test` does not cover them. Run their standalone
      # vitest config explicitly — otherwise these tests can rot unnoticed.
      - name: Test (api functions)
        run: npx vitest run --config api/vitest.config.ts

      # The i18n-content-extract and content-i18n-lint tools live under
      # utilities/* (outside pnpm-workspace.yaml), so `pnpm -r test` never
      # reaches their vitest suites. Run them explicitly — these are the
      # regression guards for the Tier B content-i18n extractor + drift gate
      # (spec 046 T024/T031, spec 050 T010/T013), so they must run in CI.
      - name: Test (i18n utilities — outside the pnpm workspace)
        run: pnpm run test:i18n-utilities

      # spec-trace is likewise outside the workspace. Its search half is what
      # the crew uses instead of reading whole spec files, and the budget cap
      # it advertises is load-bearing — callers size their context around it,
      # so an unenforced cap is a silent context blowout, not a cosmetic bug.
      - name: Test (spec-trace — outside the pnpm workspace)
        run: pnpm run test:spec-trace

      # facet-index is likewise outside the workspace (CLAUDE.md "Standalone
      # utilities"). Its lens-vocabulary-lockstep test is the runtime half of
      # spec 045's drift guard between content/keyboard-facets YAML and the
      # canonical Scale/DiacriticBehavior types — unenforced here, it can drift
      # silently.
      - name: Test (facet-index — outside the pnpm workspace)
        run: pnpm run test:facet-index

      # kbgen is a prototype outside the workspace too, and since the
      # parseUnicodeSet retirement it imports engine character-discovery
      # internals by relative src path (spec 044 FR-015: one exemplar path).
      # Nothing else typechecks it, so an engine rename would break it silently.
      - name: Test (kbgen — outside the pnpm workspace)
        run: pnpm run test:kbgen

      # km-triage-app (the km-triage GitHub App's audit/cache/manifest/sweep
      # helpers) tests with node:test, not vitest, and nothing ran them.
      - name: Test (km-triage-app — outside the pnpm workspace)
        run: pnpm run test:km-triage

      # supportability-scanner's own vitest suite — supportability-scan.yml
      # only runs `scan.ts --check`, so the scanner's unit tests (including
      # the provenance fix) ran nowhere.
      - name: Test (supportability-scanner — outside the pnpm workspace)
        run: pnpm run test:supportability-scanner

      # Non-blocking: warns in CI log and opens GitHub Issues for any spec
      # sections whose content changed since the last acknowledgement.
      # Never fails the build — drift is a backlog item, not a blocker.
      - name: Spec drift check
        continue-on-error: true
        run: node utilities/spec-trace/index.js check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_TRACE_REPO: ${{ github.repository }}

  # Playwright e2e — the lane that carries the spec 034 authoring-walk proof
  # (MVP gaps A/B assert in copy-edit.spec.ts). NON-BLOCKING while it beds in:
  # `continue-on-error` keeps a red run from failing the workflow, and this
  # job is not a required check. Starts with boot-smoke + copy-edit only;
  # widen the spec list (or drop the filter) as specs prove stable in CI, and
  # make it blocking once it is.
  e2e:
    name: e2e (Playwright, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pinned corpus as the build job: the dev server's local-keyboards
      # plugin (vite.config.ts, KEYBOARDS_REPO) serves the catalog and the
      # base keyboards the walks open from it.
      - name: Checkout keyboard-studio/keyboards corpus (pinned, release/ only, shallow)
        uses: actions/checkout@v4
        with:
          repository: keyboard-studio/keyboards
          ref: ${{ env.KEYBOARDS_CORPUS_SHA }}
          path: .keyboards
          fetch-depth: 1
          sparse-checkout: release
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Place corpus at ../keyboards
        run: |
          corpus="$(dirname "$GITHUB_WORKSPACE")/keyboards"
          mv "$GITHUB_WORKSPACE/.keyboards" "$corpus"
          echo "KEYBOARDS_REPO=$corpus" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen (charnames — offline, build input)
        run: pnpm run codegen-charnames

      # The dev server (playwright.config.ts webServer: `pnpm dev` = vite)
      # imports the workspace packages through their built dist/. Build only
      # studio's dependencies (`studio^...`) — studio itself is served from
      # source, and its production build + postbuild catalog are not needed.
      - name: Build studio's workspace dependencies
        run: pnpm --filter "@keyboard-studio/studio^..." build

      - name: Install Playwright Chromium
        working-directory: packages/studio
        run: npx playwright install --with-deps chromium

      - name: Playwright (boot-smoke + copy-edit)
        run: pnpm --filter @keyboard-studio/studio test:e2e boot-smoke copy-edit

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/studio/playwright-report/
            packages/studio/test-results/
          retention-days: 14
          if-no-files-found: ignore
