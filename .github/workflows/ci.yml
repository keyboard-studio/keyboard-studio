# CI — typecheck / lint / test / build for the monorepo. See #2.
# Minimal-by-design: matches what `pnpm test`/`pnpm build`/`pnpm lint` do locally.
# Extend later (coverage, matrix across Node versions) as the package set grows.

name: CI

# `pull_request` covers `dev` as well as `main` so the stacked feature branches
# that integrate through `dev` are not merged unverified. Without `dev` here a
# PR into it reported only the Vercel preview and the project-board sync —
# neither runs a test — so the first real build of that code was whenever
# `dev` -> `main` landed, long after the change.
#
# `push` stays main-only on purpose: a `pull_request` run checks out the merge
# of head into base, so the PR run already validates the integrated result and
# a post-merge `push` run on `dev` would re-test the same tree.
on:
  push:
    branches: [main]
  pull_request:
    # `km/*` added 2026-10-07 for the modular-decisions stack: stacked PRs
    # base on the previous spec's km/* branch, and without this they report
    # no CI at all (the spec 089 golden-walk capture/verify lives in the
    # e2e lane and keys off the PR base ref).
    branches: [main, dev, 'km/*']
  # Nightly full-gate run (km/ci-fast-gates, 2026-10-11): the corpus gate
  # and the golden walk are path-gated on pull requests (see the
  # `changes` job), so a scheduled run — where `changes` reports every
  # gate on — remains the unconditional backstop.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  # Reusable entry for the nightly dev soak (nightly-dev.yml,
  # km/ci-fast-gate 2026-10-15): the caller passes checkout_ref=dev so
  # the full-gate events' steps below run against the dev tree, giving
  # dev an overnight full verdict before any dev -> main merge. Normal
  # events leave the input empty and check out the triggering ref.
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Ref to check out instead of the triggering ref (the nightly dev soak passes dev)'
        type: string
        required: false
        default: ''

# Cancel a superseded run when a newer commit lands on the same ref, so a
# rapid second push doesn't leave the first full run burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned commit of keyboard-studio/keyboards (master) that the corpus-gated
  # tests run against — see the corpus checkout step.
  KEYBOARDS_CORPUS_SHA: 435f82d69bfc926eb03c2d8632571b41b6da3266

jobs:
  # Path gate for the expensive lanes (km/ci-fast-gates, 2026-10-11 —
  # this is issue #2004's km/ci-lightening gating, re-applied onto main
  # after PR #1984's merge resolved ci.yml toward the union version and
  # dropped the interim #2006 gating). Measured 2026-10-11 on current
  # main: a keyboard-adjacent build is ~77 min — Test (all packages)
  # ~23 min (engine alone 18m41s, corpus sweeps inside the unit suite),
  # corpus gate ~50 min run SERIAL, everything else ~4 min. This job
  # diffs the PR and reports which gates the change can reach:
  #   corpus — engine/contracts, the corpus harness, fetch/codegen
  #     scripts. corpus=true also runs the corpus-sweep unit tests,
  #     which no longer run in the default suite (see vitest configs).
  #   golden — the studio surfaces whose emitted bytes the walk
  #     compares, plus engine/contracts.
  #   e2e — everything `golden` covers, plus any non-markdown change under
  #     packages/studio/ (the SPA the desktop walks drive). Gates
  #     `e2e-desktop`, which is not a required check, so a skip blocks
  #     nothing. (#2367: keep PR CI under 10 minutes, target 5.)
  # ci.yml / root package.json / lockfile changes, the `run-corpus` /
  # `run-golden` / `run-all-gates` labels, and every non-PR run turn
  # every gate on; an unavailable diff fails open. The corpus gate
  # stays INSIDE `build` — the required status check in the main
  # rulesets. Since km/ci-fast-gate (2026-10-15, owner ruling), the
  # corpus gate and the full test suite run on non-PR events only
  # (pushes to main, the nightly schedule, manual dispatch); per-PR,
  # `build` relies on the `fast` job's verdict plus test:pr instead —
  # see the `fast` job below and scripts/test-pr.mjs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      corpus: ${{ steps.gates.outputs.corpus }}
      golden: ${{ steps.gates.outputs.golden }}
      e2e: ${{ steps.gates.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0

      - name: Decide which expensive gates this change needs
        id: gates
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          corpus=false
          golden=false
          e2e=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            corpus=true
            golden=true
            e2e=true
          else
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true)"
            if [ -z "$files" ]; then
              # Diff unavailable — fail open and run everything.
              corpus=true
              golden=true
              e2e=true
            else
              while IFS= read -r f; do
                case "$f" in
                  .github/workflows/ci.yml|package.json|pnpm-lock.yaml)
                    corpus=true; golden=true ;;
                  packages/engine/*|packages/contracts/*)
                    corpus=true; golden=true ;;
                  utilities/nfd-tolerance-corpus/*|scripts/*)
                    corpus=true ;;
                  packages/studio/src/decisions/*|packages/studio/src/steps/*|packages/studio/src/stores/*|packages/studio/src/survey/*|packages/studio/src/lib/*|packages/studio/src/StudioShell.*|packages/studio/e2e/*)
                    golden=true ;;
                esac
                # e2e reaches everything golden does, plus the rest of the
                # studio package (docs-only .md edits excepted).
                case "$f" in
                  packages/studio/*.md|packages/studio/*/*.md) ;;
                  packages/studio/*|packages/glottolog/*) e2e=true ;;
                esac
              done <<< "$files"
              if [ "$golden" = "true" ]; then e2e=true; fi
            fi
            case "$PR_LABELS" in
              *'"run-corpus"'*) corpus=true ;;
            esac
            case "$PR_LABELS" in
              *'"run-golden"'*) golden=true ;;
            esac
            case "$PR_LABELS" in
              *'"run-all-gates"'*) corpus=true; golden=true; e2e=true ;;
            esac
          fi
          echo "corpus=$corpus" >> "$GITHUB_OUTPUT"
          echo "golden=$golden" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "Expensive gates for this run: corpus=$corpus golden=$golden e2e=$e2e (event: $GITHUB_EVENT_NAME)"

  # Fast gate (km/ci-fast-gate, 2026-10-15 — owner ruling after the
  # #2191 red-main incident): the cheap, high-signal slice of the build
  # job — install, build (tsc + vite), typecheck, lint — with NO test
  # suite and NO corpus gates. This is the slice that catches the
  # recurring breakage class (TS2304 missing imports, unresolved
  # modules, lint regressions) and it lands a verdict in ~5 minutes.
  # `build` needs this job, so a tree that cannot compile stops every
  # heavier lane before it burns runner time, and a reviewer always
  # has a same-tree verdict worth waiting for. The inputs mirror the
  # build job's exactly (pinned corpus for the studio postbuild, the
  # charnames codegen, and the cached SLDR/langtags fetches the lint
  # sub-checks read), minus the steps only the test suites need.
  fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Checkout keyboard-studio/keyboards corpus (pinned, release/ only, shallow)
        uses: actions/checkout@v4
        with:
          repository: keyboard-studio/keyboards
          ref: ${{ env.KEYBOARDS_CORPUS_SHA }}
          path: .keyboards
          fetch-depth: 1
          sparse-checkout: release
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Place corpus at ../keyboards
        run: |
          corpus="$(dirname "$GITHUB_WORKSPACE")/keyboards"
          mv "$GITHUB_WORKSPACE/.keyboards" "$corpus"
          echo "KEYBOARDS_REPO=$corpus" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen (charnames — offline, build input)
        run: pnpm run codegen-charnames

      - name: Cache SLDR extract
        id: sldr-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/data/sldr/sldr
          key: sldr-${{ hashFiles('scripts/sldr-version.json') }}

      - name: Fetch SLDR (pinned — determinism-test input)
        if: steps.sldr-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch-sldr

      - name: Cache langtags.json
        id: langtags-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/data/langtags/langtags.json
          key: langtags-${{ hashFiles('scripts/langtags-version.json') }}

      - name: Fetch langtags (pinned — determinism-test input)
        if: steps.langtags-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch-langtags

      - name: Build (all packages)
        run: pnpm -r build

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Lint (eslint + depcruise + crew-lint + facet-lint)
        run: pnpm lint

  build:
    needs: [changes, fast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          # Full history: the PR test step (scripts/test-pr.mjs) diffs
          # against the PR base via merge-base; the default shallow
          # checkout has no merge-base and the diff silently comes
          # back empty (caught live on #2203's first run).
          fetch-depth: 0

      # The corpus-gated unit tests (codec round-trip, carveViaSplice corpus
      # sweep, recognizer integration, touch fixtures, facet-index real-corpus
      # slice, ...) look for a sibling `../keyboards` clone next to the repo
      # root and `skipIf` it is absent — so without this step ~55 of them
      # silently skip on every run. Same sparse + shallow inputs as
      # supportability-scan.yml, but PINNED to one commit of the
      # keyboard-studio/keyboards fork so CI tests one known corpus rather
      # than whatever master is today. Bump KEYBOARDS_CORPUS_SHA deliberately
      # (and re-run the corpus tests locally against it) when the fork moves.
      - name: Checkout keyboard-studio/keyboards corpus (pinned, release/ only, shallow)
        uses: actions/checkout@v4
        with:
          repository: keyboard-studio/keyboards
          ref: ${{ env.KEYBOARDS_CORPUS_SHA }}
          path: .keyboards
          fetch-depth: 1
          sparse-checkout: release
          sparse-checkout-cone-mode: true
          persist-credentials: false

      # actions/checkout can only write inside the workspace, so move the tree
      # to the sibling path the tests resolve (`<repo>/../keyboards`). Moving
      # (not symlinking) keeps it out of the workspace, so no repo-wide walker
      # (lint, depcruise, vitest globs) ever sees 900 foreign keyboards.
      # KEYBOARDS_REPO points the studio postbuild (build-keyboards-index.mjs)
      # and vite.config.ts at the same pinned tree, so the build no longer
      # clones keyboards master into node_modules/.cache on every run.
      - name: Place corpus at ../keyboards
        run: |
          corpus="$(dirname "$GITHUB_WORKSPACE")/keyboards"
          mv "$GITHUB_WORKSPACE/.keyboards" "$corpus"
          echo "KEYBOARDS_REPO=$corpus" >> "$GITHUB_ENV"

      - name: Set up pnpm
        # Version comes from package.json "packageManager" (pnpm@9.12.0).
        # Don't also set `version` here -- action-setup@v4 errors on a conflict.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Single pin shared with local dev. A floating "22" resolves to the
          # newest 22.x here while a dev box can sit on an older patch --
          # @lingui/cli needs >= 22.19.0 and no-ops silently below it.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Offline codegen the build depends on. Most prebuild steps fetch over
      # the network (langtags/glottolog) and commit their derived index, so CI
      # skips them. Three exceptions run here, for different reasons: this one
      # because it is hermetic and the build needs it, and fetch-sldr and
      # fetch-langtags below because a test needs their raw input even though
      # the derived index is committed — see those steps' own comments.
      #
      # codegen-charnames derives from the committed, SHA-pinned
      # lib/ucd/UnicodeData.txt into a gitignored JSON that
      # engine/src/character-discovery/charNames.ts imports at build time.
      # Regenerate it here — hermetic, no network — so `pnpm -r build` resolves.
      - name: Codegen (charnames — offline, build input)
        run: pnpm run codegen-charnames

      # The exemplar index (exemplars.generated.json) IS committed, so neither
      # the build nor the app needs the raw SLDR tree. But the spec 044
      # determinism test regenerates the index from source and asserts it
      # reproduces the committed artifact byte for byte — that regeneration
      # reads packages/engine/data/sldr/sldr/, which is gitignored. Without
      # this step the test fails on every run with "not found — run
      # `pnpm run fetch-sldr` first", and the guarantee that a pin bump can't
      # silently change the index goes unenforced. Commit + tarball SHA-256 are
      # pinned in scripts/sldr-version.json and the script fails loudly on a
      # mismatch, so the fetch is reproducible despite touching the network.
      # Cache the extracted SLDR locale tree, keyed on the pinned version file
      # (scripts/sldr-version.json holds the commit + tarball SHA-256). On the
      # common path the pin is unchanged, so the extract is restored and the
      # download below is skipped. When the pin is bumped the version file
      # changes, the key misses, and fetch-sldr re-downloads and re-verifies the
      # SHA-256 — so the checksum guarantee is preserved: any change to what we
      # fetch invalidates the cache and forces a fresh verified fetch.
      - name: Cache SLDR extract
        id: sldr-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/data/sldr/sldr
          key: sldr-${{ hashFiles('scripts/sldr-version.json') }}

      - name: Fetch SLDR (pinned — determinism-test input)
        if: steps.sldr-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch-sldr

      # Same reasoning and pattern for langtags: the derived index under
      # packages/engine/src/langtags/generated/ is committed, but the langtags
      # codegen-determinism test re-derives entries from the raw
      # packages/engine/data/langtags/langtags.json (gitignored) and skips that
      # check when the file is absent. fetch-langtags pins the commit and
      # SHA-256 in scripts/langtags-version.json and fails loudly on a
      # mismatch; the cache is keyed on that file, so a pin bump forces a
      # fresh verified fetch. (It also rewrites the committed SOURCES.json,
      # byte-identically for an unchanged pin.)
      - name: Cache langtags.json
        id: langtags-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/data/langtags/langtags.json
          key: langtags-${{ hashFiles('scripts/langtags-version.json') }}

      - name: Fetch langtags (pinned — determinism-test input)
        if: steps.langtags-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch-langtags

      # Build before typecheck — engine/studio depend on contracts'
      # dist/*.d.ts at type-resolution time. Without this, downstream
      # typechecks fail with "Cannot find module '@keyboard-studio/contracts'"
      # and trigger cascade errors (e.g. switch-exhaustiveness loss
      # because LintFinding["severity"] degrades to any).
      #
      # On pull requests the next three steps are skipped: the `fast`
      # job (a required predecessor of this job) already ran build,
      # typecheck and lint on this same merge tree, and re-running them
      # here would only duplicate its verdict. Non-PR events keep this
      # job self-contained and unchanged.
      - name: Build (all packages)
        if: github.event_name != 'pull_request'
        run: pnpm -r build

      - name: Typecheck (all packages)
        if: github.event_name != 'pull_request'
        run: pnpm -r typecheck

      - name: Lint (eslint + depcruise + crew-lint + facet-lint)
        if: github.event_name != 'pull_request'
        run: pnpm lint

      # Full suite on non-PR events only (km/ci-fast-gate, 2026-10-15):
      # pushes to main, the nightly schedule and manual dispatch are
      # the full-gate backstop. Per-PR, the step below runs instead.
      - name: Test (all packages)
        if: github.event_name != 'pull_request'
        run: pnpm -r test

      # Per-PR test gate (km/ci-fast-gate, 2026-10-15 — owner ruling:
      # per-PR CI under ~10 minutes): vitest related for the files the
      # PR touches plus the curated core suites that caught the October
      # red-main breaks, per package. See scripts/test-pr.mjs for the
      # lists and the fallback rules; the full suite runs overnight.
      - name: Test (PR — affected + curated core)
        if: github.event_name == 'pull_request'
        run: node scripts/test-pr.mjs ${{ github.event.pull_request.base.sha }}

      # The utility suites below (i18n extract, kbgen, nfd-tolerance,
      # supportability) resolve @keyboard-studio/engine through its
      # built dist/ entry — on non-PR events the Build step above
      # produced it, but on the PR path that step is skipped (the fast
      # job built on a different runner) and test:pr only builds the
      # deps of the packages it runs. Build the workspace deps
      # explicitly here (tsc only, no vite) so the utility steps see
      # the same tree either way.
      - name: Build workspace dependencies (PR path — utility suites resolve engine via dist)
        if: github.event_name == 'pull_request'
        run: pnpm --filter "@keyboard-studio/studio^..." build

      # Corpus-sweep unit tests (km/ci-fast-gates): *.corpus.test.ts
      # files sweep the pinned corpus and accounted for
      # much of the engine suite's 18m41s in the step above. They are
      # excluded from the packages' default vitest configs and run here
      # instead — only when the `changes` job says this PR can affect
      # the corpus surface at all. Same files, same assertions; only
      # their trigger changed.
      - name: Test (corpus sweeps — engine + studio, path-gated)
        if: github.event_name != 'pull_request' && needs.changes.outputs.corpus == 'true'
        run: |
          pnpm --filter @keyboard-studio/engine exec vitest run --config vitest.corpus.config.ts
          pnpm --filter @keyboard-studio/studio exec vitest run --config vitest.corpus.config.ts

      # spec 086 SC-005: the generation-time budget (p95 under 5 s over every
      # parseable corpus keyboard) is opt-in via KS_CORPUS_PERF, so the line above
      # never runs it. This job holds the pinned corpus, so gate it here. (The
      # parity suite needs no flag: it fails when CI is set and the corpus is
      # missing.) Runs under the corpus vitest config (km/ci-fast-gates):
      # the default config now excludes corpus files even when named.
      - name: Test (context normalization generation-time budget, corpus)
        if: github.event_name != 'pull_request' && needs.changes.outputs.corpus == 'true'
        run: pnpm --filter @keyboard-studio/engine exec vitest run --config vitest.corpus.config.ts normalization-step/generation-time.corpus
        env:
          KS_CORPUS_PERF: "1"

      # The co-located Vercel functions under /api are intentionally outside the
      # pnpm workspace, so `pnpm -r test` does not cover them. Run their standalone
      # vitest config explicitly — otherwise these tests can rot unnoticed.
      - name: Test (api functions)
        run: npx vitest run --config api/vitest.config.ts

      # The i18n-content-extract and content-i18n-lint tools live under
      # utilities/* (outside pnpm-workspace.yaml), so `pnpm -r test` never
      # reaches their vitest suites. Run them explicitly — these are the
      # regression guards for the Tier B content-i18n extractor + drift gate
      # (spec 046 T024/T031, spec 050 T010/T013), so they must run in CI.
      - name: Test (i18n utilities — outside the pnpm workspace)
        run: pnpm run test:i18n-utilities

      # spec-trace is likewise outside the workspace. Its search half is what
      # the crew uses instead of reading whole spec files, and the budget cap
      # it advertises is load-bearing — callers size their context around it,
      # so an unenforced cap is a silent context blowout, not a cosmetic bug.
      - name: Test (spec-trace — outside the pnpm workspace)
        run: pnpm run test:spec-trace

      # facet-index is likewise outside the workspace (CLAUDE.md "Standalone
      # utilities"). Its lens-vocabulary-lockstep test is the runtime half of
      # spec 045's drift guard between content/keyboard-facets YAML and the
      # canonical Scale/DiacriticBehavior types — unenforced here, it can drift
      # silently.
      - name: Test (facet-index — outside the pnpm workspace)
        run: pnpm run test:facet-index

      # spec 078 FR-012: the context-tolerance transform must never make a
      # keyboard worse. The corpus harness (utilities/nfd-tolerance-corpus, outside
      # the workspace) runs the real transform over the pinned corpus checked out
      # above, recompiles and re-simulates each keyboard, and --fail-on-regressed
      # exits 1 when any keyboard lands in the `regressed` bucket. Its hermetic
      # unit suite runs first; the sweep itself takes several minutes.
      - name: Test (nfd-tolerance-corpus — outside the pnpm workspace)
        run: pnpm run test:nfd-tolerance-corpus

      # Path-gated by the `changes` job and parallelised
      # (km/ci-fast-gates): the harness verifies keyboards in parallel
      # worker processes via --jobs, but its default is 1 — serial —
      # which is how this step took ~50 min on a 4-vCPU runner. --jobs 4
      # matches the runner; same keyboards, same verdict, ~1/4 the wall
      # time. It still runs inside this required `build` check, but
      # since km/ci-fast-gate (2026-10-15) only on the full-gate events
      # — pushes to main, nightly, manual dispatch — not per-PR.
      - name: Corpus gate (skipped — change cannot reach the transform, or per-PR)
        if: github.event_name == 'pull_request' || needs.changes.outputs.corpus != 'true'
        run: echo "Corpus gate not run in this lane — per-PR runs leave it to the overnight/full-gate events (km/ci-fast-gate, 2026-10-15), and a change that touches no engine/contracts/corpus path cannot reach the transform. Non-PR runs with corpus reach run it in the next step."

      - name: Corpus gate (context tolerance — zero regressed keyboards)
        if: github.event_name != 'pull_request' && needs.changes.outputs.corpus == 'true'
        run: node utilities/nfd-tolerance-corpus/run.mjs --fail-on-regressed --jobs 4

      # spec 086: the committed verification record for the context normalization
      # step must be fresh for every corpus keyboard (source hash and generator
      # version). --check never simulates; regenerate with --incremental when it fails.
      - name: Corpus gate (context normalization verification record is fresh)
        run: node utilities/nfd-tolerance-corpus/run.mjs --mode normalization-step --check

      # kbgen is a prototype outside the workspace too, and since the
      # parseUnicodeSet retirement it imports engine character-discovery
      # internals by relative src path (spec 044 FR-015: one exemplar path).
      # Nothing else typechecks it, so an engine rename would break it silently.
      - name: Test (kbgen — outside the pnpm workspace)
        run: pnpm run test:kbgen

      # km-triage-app (the km-triage GitHub App's audit/cache/manifest/sweep
      # helpers) tests with node:test, not vitest, and nothing ran them.
      - name: Test (km-triage-app — outside the pnpm workspace)
        run: pnpm run test:km-triage

      # The headless-sweep issue filer (spec 107) tests with node:test too.
      - name: Test (headless-sweep issue filer)
        run: pnpm run test:sweep-issues

      # supportability-scanner's own vitest suite — supportability-scan.yml
      # only runs `scan.ts --check`, so the scanner's unit tests (including
      # the provenance fix) ran nowhere.
      - name: Test (supportability-scanner — outside the pnpm workspace)
        run: pnpm run test:supportability-scanner

      # Non-blocking: warns in CI log and, on main-tree runs only, opens
      # GitHub Issues for any spec sections whose content changed since
      # the last acknowledgement.
      # Never fails the build — drift is a backlog item, not a blocker.
      - name: Spec drift check
        continue-on-error: true
        run: node utilities/spec-trace/index.js check
        env:
          # Issue sync only from a main-tree checkout (#2210). Detection and
          # [WARN] logging run on every tree; with an empty token/repo the
          # checker skips create/close sync gracefully. The gate keys on the
          # EFFECTIVE ref (inputs.checkout_ref, else github.ref — the
          # Checkout step's idiom): inside the workflow_call dev soak the
          # github context is the caller's (event schedule, ref main) while
          # the tree on disk is dev, so keying on github.ref or event_name
          # alone would let the soak sync against the dev tree — the flap
          # that closed #2136 and re-filed it as #2209. Do not simplify this
          # condition without re-reading #2210.
          GITHUB_TOKEN: ${{ (github.event_name != 'pull_request' && (inputs.checkout_ref == 'main' || inputs.checkout_ref == 'refs/heads/main' || (inputs.checkout_ref == '' && github.ref == 'refs/heads/main')) && secrets.GITHUB_TOKEN) || '' }}
          SPEC_TRACE_REPO: ${{ (github.event_name != 'pull_request' && (inputs.checkout_ref == 'main' || inputs.checkout_ref == 'refs/heads/main' || (inputs.checkout_ref == '' && github.ref == 'refs/heads/main')) && github.repository) || '' }}

  # Playwright e2e — the lanes that carry the spec 034 authoring-walk proof
  # (MVP gaps A/B assert in copy-edit.spec.ts). NON-BLOCKING while they bed
  # in: `continue-on-error` keeps a red run from failing the workflow, and
  # these jobs are not required checks.
  #
  # Split into three parallel jobs 2026-10-18 (option A, owner ruling):
  # the single 60-minute job was over capacity — on run 39134517399 the
  # desktop step alone took 44m22s, the mobile step was skipped behind its
  # failure, and the golden-walk capture was cancelled at the job cap so
  # its verify never ran. Each lane now gets its own 60-minute envelope
  # and its own verdict. The shared setup block repeats per job (GitHub
  # Actions has no step-level reuse); it costs a few minutes of setup per
  # lane and buys independent, parallel results.

  #
  # Desktop lane budget (#2367 - PR CI must finish in under 10 minutes,
  # target 5). Measured on run 41069595484: boot-smoke ~48 s,
  # decision-store-reload ~21 s, touch-key-identity ~4.3 m (walk 1 ~50 s),
  # copy-edit ~10.6 m - 16.1 m of tests in total. Pull requests therefore
  # run only the quick slice (boot-smoke, decision-store-reload and spec
  # 104 walk 1), and only when the `changes` job says the PR can reach the
  # SPA (outputs.e2e). Every non-PR event (the nightly schedule, push to
  # main, workflow_dispatch, the nightly dev soak) runs the full set, and
  # a failure there is filed by the `e2e-nightly-report` job below.
  e2e-desktop:
    name: e2e desktop (Playwright, non-blocking)
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      pw_failed: ${{ steps.verdict.outputs.failed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      # Same pinned corpus as the build job: the dev server's local-keyboards
      # plugin (vite.config.ts, KEYBOARDS_REPO) serves the catalog and the
      # base keyboards the walks open from it.

      - name: Checkout keyboard-studio/keyboards corpus (pinned, release/ only, shallow)
        uses: actions/checkout@v4
        with:
          repository: keyboard-studio/keyboards
          ref: ${{ env.KEYBOARDS_CORPUS_SHA }}
          path: .keyboards
          fetch-depth: 1
          sparse-checkout: release
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Place corpus at ../keyboards
        run: |
          corpus="$(dirname "$GITHUB_WORKSPACE")/keyboards"
          mv "$GITHUB_WORKSPACE/.keyboards" "$corpus"
          echo "KEYBOARDS_REPO=$corpus" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen (charnames — offline, build input)
        run: pnpm run codegen-charnames

      # The dev server (playwright.config.ts webServer: `pnpm dev` = vite)
      # imports the workspace packages through their built dist/. Build only
      # studio's dependencies (`studio^...`) — studio itself is served from
      # source, and its production build + postbuild catalog are not needed.

      - name: Build studio's workspace dependencies
        run: pnpm --filter "@keyboard-studio/studio^..." build

      - name: Install Playwright Chromium
        working-directory: packages/studio
        run: npx playwright install --with-deps chromium

      # PR lane: the quick slice only, in ONE command so one results.json
      # feeds the summary step. The positional args pick the three spec
      # files; --grep then narrows touch-key-identity to spec 104 walk 1 by
      # describe title (never by line number). Playwright tests --grep
      # against the project name, file name, describe titles and test title
      # joined by spaces, so the boot-smoke and decision-store-reload
      # alternatives match every test in those files by file name, and no
      # touch-key-identity title contains either string. A grep that matches
      # nothing makes Playwright exit non-zero ("No tests found").
      - name: Playwright (PR quick slice - boot-smoke + decision-store-reload + spec 104 walk 1)
        id: pw_pr
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm --filter @keyboard-studio/studio test:e2e --project=desktop boot-smoke decision-store-reload touch-key-identity --grep "boot-smoke|decision-store-reload|spec 104 walk 1:"

      # Full set (nightly schedule, push to main, workflow_dispatch):
      # boot-smoke + copy-edit + spec 088 live gate + spec 104 walks.
      - name: Playwright (full set - boot-smoke + copy-edit + spec 088 live gate + spec 104 touch-key identity walks)
        id: pw_full
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm --filter @keyboard-studio/studio test:e2e --project=desktop boot-smoke copy-edit decision-store-reload touch-key-identity

      # `continue-on-error` makes this job report success even when the
      # tests failed, so surface the real verdict as a job output for
      # `e2e-nightly-report`. On a non-PR event anything
      # but a passing full set counts (a failed setup step skips the test
      # step).
      - name: Record test verdict
        id: verdict
        if: ${{ !cancelled() }}
        run: echo "failed=${{ steps.pw_pr.outcome == 'failure' || (github.event_name != 'pull_request' && steps.pw_full.outcome != 'success') }}" >> "$GITHUB_OUTPUT"

      - name: Summarize Playwright results
        if: always()
        working-directory: packages/studio
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const file = "test-results/results.json";
          if (!fs.existsSync(file)) { console.log("### e2e desktop\nNo Playwright results (the run did not reach the tests)."); process.exit(0); }
          const r = JSON.parse(fs.readFileSync(file, "utf8"));
          const s = r.stats ?? {};
          console.log(`### e2e desktop: ${s.expected ?? 0} passed, ${s.unexpected ?? 0} failed, ${s.flaky ?? 0} flaky, ${s.skipped ?? 0} skipped (${Math.round((s.duration ?? 0) / 1000)}s)`);
          const rows = [];
          const walk = (suite, trail) => {
            for (const spec of suite.specs ?? []) for (const t of spec.tests ?? []) {
              if (t.status === "expected" || t.status === "skipped") continue;
              const last = t.results?.[t.results.length - 1];
              const errs = last?.errors?.length ? last.errors : [last?.error ?? { message: last?.status ?? "" }];
              const msg = errs.map((e) => (e?.message ?? "").replace(/\u001b\[[0-9;]*m/g, "").split("\n")[0]).filter(Boolean).join(" / ").replace(/\|/g, "\\|").slice(0, 300);
              const title = [...trail, spec.title].join(" > ");
              rows.push(`| ${t.status} | ${title.replace(/\|/g, "\\|")} | ${msg} |`);
              const body = errs.map((e) => (e?.message ?? "").replace(/\u001b\[[0-9;]*m/g, "").split("\n").filter((l) => l.trim()).slice(0, 20).join("\n")).join("\n---\n").slice(0, 2000);
              const esc = (v) => v.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.error(`::error title=${esc(`e2e desktop ${t.status}: ${title}`).replace(/:/g, "%3A").replace(/,/g, "%2C")}::${esc(body)}`);
            }
            for (const child of suite.suites ?? []) walk(child, [...trail, child.title]);
          };
          for (const suite of r.suites ?? []) walk(suite, [suite.title]);
          if (rows.length) console.log(["", "| status | test | first line of each error |", "|---|---|---|", ...rows].join("\n"));
          EOF

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop
          path: |
            packages/studio/playwright-report/
            packages/studio/test-results/
          retention-days: 14
          if-no-files-found: ignore


  # Files or updates a tracking issue when the full desktop set fails on a
  # non-PR event, so a nightly failure is not silent (#2367). One open issue
  # per ref: later failures comment on it instead of opening duplicates.
  # `e2e-desktop` is `continue-on-error`, so its `result` is always
  # success; the verdict comes from its `pw_failed` output.
  e2e-nightly-report:
    name: e2e nightly failure report
    needs: e2e-desktop
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.e2e-desktop.outputs.pw_failed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_REF: ${{ inputs.checkout_ref || github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the tracking issue
        run: |
          title="Nightly e2e desktop failure ($TARGET_REF)"
          body="The full desktop Playwright set failed on $TARGET_REF (event: $GITHUB_EVENT_NAME). Run: $RUN_URL. The PR lane only runs a quick slice; copy-edit and the other long walks run on the schedule only (docs/tooling.md, PR CI budget). Reproduce locally: pnpm --filter @keyboard-studio/studio test:e2e --project=desktop boot-smoke copy-edit decision-store-reload touch-key-identity"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Headless scripted author, PR lane (spec 107 FR-031, SC-002). Its own job
  # beside `build`: it needs only `changes`, and `build` does not need it, so
  # it adds no wall time to the fast -> build chain. Same path gate as
  # e2e-desktop (outputs.e2e). The job id and name are the required-check
  # name once it is added to the `main: CI + integrity` ruleset: do not
  # rename either without updating the ruleset in the same change.
  headless-author:
    name: headless-author
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      # Same pinned corpus as the build job (KEYBOARDS_CORPUS_SHA).
      - name: Checkout keyboard-studio/keyboards corpus (pinned, release/ only, shallow)
        uses: actions/checkout@v4
        with:
          repository: keyboard-studio/keyboards
          ref: ${{ env.KEYBOARDS_CORPUS_SHA }}
          path: .keyboards
          fetch-depth: 1
          sparse-checkout: release
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Place corpus at ../keyboards
        run: |
          corpus="$(dirname "$GITHUB_WORKSPACE")/keyboards"
          mv "$GITHUB_WORKSPACE/.keyboards" "$corpus"
          echo "KEYBOARDS_REPO=$corpus" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen (charnames - offline, build input)
        run: pnpm run codegen-charnames

      # Raw SLDR and langtags inputs, cached on their pin files exactly as in
      # the build job (a pin bump misses the key and forces a verified fetch).
      - name: Cache SLDR extract
        id: sldr-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/data/sldr/sldr
          key: sldr-${{ hashFiles('scripts/sldr-version.json') }}

      - name: Fetch SLDR (pinned)
        if: steps.sldr-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch-sldr

      - name: Cache langtags.json
        id: langtags-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/data/langtags/langtags.json
          key: langtags-${{ hashFiles('scripts/langtags-version.json') }}

      - name: Fetch langtags (pinned)
        if: steps.langtags-cache.outputs.cache-hit != 'true'
        run: pnpm run fetch-langtags

      - name: Build studio's workspace dependencies
        run: pnpm --filter "@keyboard-studio/studio^..." build

      - name: Headless author (PR set, parity, drift guard)
        run: >-
          pnpm --filter @keyboard-studio/studio exec vitest run
          --config vitest.corpus.config.ts
          src/test/headlessAuthor/prSet
          src/test/headlessAuthor/parity
          src/test/headlessAuthor/driftGuard

      # driftGuard and boundary are plain unit tests: the corpus config above
      # only matches *.corpus.test.ts, so they need the default config.
      - name: Headless author (drift guard, boundary)
        run: >-
          pnpm --filter @keyboard-studio/studio exec vitest run
          src/test/headlessAuthor/driftGuard
          src/test/headlessAuthor/boundary

  e2e-mobile:
    name: e2e mobile (Playwright, non-blocking)
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      # Same pinned corpus as the build job: the dev server's local-keyboards
      # plugin (vite.config.ts, KEYBOARDS_REPO) serves the catalog and the
      # base keyboards the walks open from it.

      - name: Checkout keyboard-studio/keyboards corpus (pinned, release/ only, shallow)
        uses: actions/checkout@v4
        with:
          repository: keyboard-studio/keyboards
          ref: ${{ env.KEYBOARDS_CORPUS_SHA }}
          path: .keyboards
          fetch-depth: 1
          sparse-checkout: release
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Place corpus at ../keyboards
        run: |
          corpus="$(dirname "$GITHUB_WORKSPACE")/keyboards"
          mv "$GITHUB_WORKSPACE/.keyboards" "$corpus"
          echo "KEYBOARDS_REPO=$corpus" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
