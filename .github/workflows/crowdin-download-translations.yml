# Crowdin `download translations` (spec 046 T038). Scheduled half of the
# round-trip: pulls whatever translators have completed in the Crowdin project
# for every file group in crowdin.yml, pushes to a dedicated branch, and opens
# a PR against main. That PR goes through the normal merge gate (CI +
# km-triage/review) like any other PR -- the
# `chore(process):` title is a deliberate opt-in to the triage's pre-approved
# process-only bypass (see .claude/agents/km-triage skill, Pre-filter D), since
# a translated-value-only diff has no code surface for the review crew to
# examine.
#
# Trigger is a daily cron. A true webhook (Crowdin project settings calling
# this repo the moment a translation completes) is a Crowdin-side integration
# outside this repo's config; add a repository_dispatch trigger here if that
# gets wired up later. workflow_dispatch covers on-demand runs meanwhile.
#
# Scope note: this was Tier A only when written, but crowdin.yml gained its
# Tier B block (content/i18n/en/*.json) in 2026-07, so this job now syncs both
# tiers -- five source catalogs, not one. Anything reasoning about its blast
# radius should read crowdin.yml, not this header.
#
# TOKEN: this job opens its PR with a PAT (repo secret L10N_PR_TOKEN), not the
# built-in GITHUB_TOKEN. Same pattern, and the same shape of reason, as
# project-status-sync.yml's PROJECT_SYNC_TOKEN. Two independent causes, either
# of which alone would justify it:
#
#   1. GITHUB_TOKEN cannot open a PR unless the repo setting "Allow GitHub
#      Actions to create and approve pull requests" (Settings > Actions >
#      General) is enabled, and that setting is repo-ADMIN-only. Every run of
#      this workflow from its first on 2026-07-22 died at CREATE PULL REQUEST
#      with a 403 for exactly this reason -- 16 consecutive failures.
#
#   2. The one that actually matters: a PR opened with GITHUB_TOKEN does NOT
#      trigger any workflow. GitHub suppresses that to prevent recursion. ci.yml
#      runs `build` on pull_request, and utilities/i18n-collapse-guard runs
#      inside `build` (via the two catalog lints in `pnpm lint`). So a
#      GITHUB_TOKEN-opened PR would arrive with no checks, a required status that
#      can never go green, and -- worse -- the collapse guard never executing at
#      all. Enabling the admin setting on its own would produce an unmergeable
#      translation PR with the safety net switched off.
#
# A PAT fixes both: no repo setting needed, and the PR it opens triggers CI like
# any human's. Cost: the PR is authored by the token's owner rather than
# github-actions[bot], and someone has to own a long-lived credential. Scope
# needed is `repo` on this repository.

name: Crowdin download translations

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  download:
    runs-on: ubuntu-latest
    # These govern the BUILT-IN GITHUB_TOKEN, which actions/checkout still uses
    # and which the crowdin action may use for the branch push. The PR itself is
    # opened with the PAT below -- see the TOKEN note in the header.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail here, loudly and by name, rather than letting the crowdin action die
      # deep in its own CREATE PULL REQUEST step with an opaque auth error that
      # looks identical to the 403 this token exists to avoid. Read into an env
      # var rather than interpolated into the script body, so the secret is never
      # expanded onto a command line.
      - name: Require L10N_PR_TOKEN
        env:
          L10N_PR_TOKEN: ${{ secrets.L10N_PR_TOKEN }}
        run: |
          if [ -z "$L10N_PR_TOKEN" ]; then
            echo "[ERROR] Repo secret L10N_PR_TOKEN is not set."
            echo "[ERROR] This job needs a PAT with 'repo' scope to open its PR."
            echo "[ERROR] See the TOKEN note at the top of this workflow file."
            exit 1
          fi
          echo "[OK] L10N_PR_TOKEN is present."

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: true
          # Must match crowdin.yml -- this action input overrides the config file,
          # so a mismatch here silently defeats the setting there. Read the long
          # note in crowdin.yml before changing it: `true` DELETES untranslated
          # keys (measured 2026-08-05: fr/messages.json 1201 -> 918, fr/patterns
          # .json 97 -> `{}`), which breaks the key-set parity the loaders need.
          skip_untranslated_strings: false
          create_pull_request: true
          localization_branch_name: l10n_crowdin_action
          pull_request_title: "chore(process): sync Crowdin translations"
          pull_request_body: "Automated translation sync from the Crowdin project, covering every file group in crowdin.yml (Tier A studio UI chrome + Tier B content sidecars). Generated by crowdin-download-translations.yml (spec 046 T038).\n\nREAD THIS DIFF BY HAND. Untranslated strings arrive as the ENGLISH SOURCE TEXT, not as empty values (skip_untranslated_strings is false, deliberately -- see the note in crowdin.yml). So English appearing where French used to be is not automatically a bug, and is not automatically fine either: it means Crowdin holds no translation for that string. A catalog at 0% translated will arrive 100% English and trip the i18n collapse guard, which is the guard telling the truth. Check that the French you expect to exist is still here, and that any newly-English string is one Crowdin genuinely has no translation for."
        env:
          # The PAT, not secrets.GITHUB_TOKEN -- see the TOKEN note in the header.
          # Swapping this back to GITHUB_TOKEN silently disables CI on the PRs this
          # job opens, which disables the collapse guard with it.
          GITHUB_TOKEN: ${{ secrets.L10N_PR_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
