<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>drag-test</title></head>
<body>
<div id="log">waiting…</div>
<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">
  <button id="chip" type="button" draggable="true"
    style="flex:0 0 auto;min-width:40px;min-height:40px;padding:6px 10px;font-size:18px;cursor:grab;touch-action:pan-x;user-select:none;-webkit-touch-callout:none;">X</button>
</div>
<div id="dropzone" style="margin-top:200px;width:200px;height:100px;border:2px dashed gray;">drop here</div>
<script>
const log = document.getElementById('log');
const chip = document.getElementById('chip');
// Mirror the React pointer handlers (early-return for mouse)
chip.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  log.textContent = 'touch pointerdown (unexpected)';
});
chip.addEventListener('dragstart', e => {
  e.dataTransfer.setData('application/x-ks-tray-letter', 'X');
  e.dataTransfer.effectAllowed = 'copy';
  log.textContent = 'DRAGSTART FIRED';
  document.title = 'DRAGSTART FIRED';
});
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => {
  e.preventDefault();
  log.textContent = 'dragover: types=' + JSON.stringify(Array.from(e.dataTransfer.types));
});
dz.addEventListener('drop', e => {
  e.preventDefault();
  const v = e.dataTransfer.getData('application/x-ks-tray-letter');
  log.textContent = 'DROP got: ' + JSON.stringify(v);
  document.title = 'DROP got: ' + v;
});
</script>
</body>
</html>
