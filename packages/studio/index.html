<!DOCTYPE html>
<!--
  class="sil-app" data-theme="navy" are static (not injected by JS) so the
  navy theme paints before React (or even theme.ts) ever runs: html/body
  need --app-* tokens above the React root, SelectMenu portals its listbox
  to document.body (outside the #root subtree), and a static attribute means
  zero FOUC and zero extra test setup for the default theme. theme.ts's
  applyTheme() only needs to *change* this attribute for a non-default
  choice, not create it. See src/lib/theme.ts.
-->
<html lang="en" class="sil-app" data-theme="navy">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: when the virtual keyboard opens,
         the browser resizes the LAYOUT viewport (not just the visual one), so
         the 100dvh shell — and the journey footer at its bottom — shrink to
         sit just above the keyboard instead of hiding under it (#2570).
         Without this, Android Chrome/Brave (Chrome 108+ default
         resizes-visual) leave the layout viewport full-height and the footer
         unreachable until the keyboard is dismissed. 100dvh alone is
         URL-bar-aware, never keyboard-aware. iOS Safari silently ignores
         this property: no behaviour change there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Keyboard Studio</title>
    <!-- Favicon: same icon as the landing page (index.html at the repo root),
         copied into public/ so Vite ships it at the site root. Keep the two
         in sync when the landing-page icon changes. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts are self-hosted (spec 095 FR-005): the studio discloses
         nothing to Google Fonts on page load. The vendored set in
         public/fonts/ is byte-for-byte the families/weights/subsets the
         Google Fonts stylesheet used to serve (Lora ital, Playfair
         Display 500;600, Source Sans 3 400;500;600;700, Noto Sans
         400;500;600;700, Charis SIL 400;700, Andika 400;700 — Andika
         was added to the Google request by #2080 and vendored the same
         way when this branch merged, rather than re-admitting the
         Google disclosure). -->
    <link href="/fonts/fonts.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!--
      Pre-mount crash fallback (spec 060, FR-061, FR-123).

      Hidden until main.tsx's top-level catch reveals it. This is the ONLY
      surface available when the app throws before createRoot(...).render(...)
      — no React, no catalog, no component tree exists yet, so anything richer
      would itself fail to render.

      THE TEXT IS HARD-CODED ENGLISH ON PURPOSE (FR-123), the single documented
      exception to the message-catalog rule. At this point no locale has
      necessarily loaded: `localeReady` is exactly one of the awaits that can
      throw here. Routing this string through the catalog would mean the
      fallback for "the app failed to start" depends on the app having started.

      Styles are inline for the same reason — the stylesheet is imported by
      main.tsx, which is the module that just failed.
    -->
    <div
      id="pre-mount-crash"
      role="alert"
      hidden
      style="
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      "
    >
      <h1 style="font-size: 1.5rem">Keyboard Studio could not start</h1>
      <p>
        Something went wrong before the page finished loading. A report has been
        sent so this can be fixed.
      </p>
      <p>Reloading the page will often resolve it.</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
