# Thin modular YAML for Phase F.
# Each question's definition lives in packages/studio/src/survey/questions/f/<id>.ts.
# This file contains only the flow metadata and ordered question ID list.
# The original phase_f_helpdocs.yaml is preserved — do NOT delete it.
#
# Membership is a DECLARATION OF MEMBERSHIP, not a routing table — routing lives
# in each module's definition.next (see loadModularFlow.ts). The order below
# mirrors the happy-path walk for readability.
#
# Shape of the walk:
#   core            pf_doc_language -> pf_welcome_paragraph -> pf_font_guidance
#                   -> pf_usage_tip_1 -> pf_usage_tip_2
#   depth gate      pf_more_detail_gate — No routes straight to pf_credits, so a
#                   minimal keyboard finishes in a few screens.
#   optional        pf_scope_variety -> pf_provenance_basis -> pf_design_rationale
#                   -> [pf_canonical_order -> pf_script_glossary, non-roman only]
#                   -> pf_example_words -> pf_troubleshooting
#                   -> pf_related_keyboards -> pf_known_limitations
#                   -> pf_further_reading -> pf_project_url
#   close           pf_credits -> pf_contact_info
#
# pf_design_rationale branches on ctx.routing_group ("non-roman" vs
# "qwerty-qwertz", set from the identity step) so canonical mark order and script
# terminology are asked only where they mean something.
#
# DEMOTED (deliberately absent, revivable by re-adding the id here):
#   pf_usage_tip_3, pf_usage_tip_4, pf_usage_tip_5
# Five fixed tip slots fit neither end of the shipped corpus — 54% of published
# help pages are one paragraph plus an auto-rendered layout chart, while
# complex-script keyboards document 14-30 rule sections. pf_more_detail_gate
# scales depth instead. The three modules remain registered, on disk, and
# test-covered (demotion is not deletion).

flow_id: phase_f_helpdocs
phase: "F"

questions:
  - pf_doc_language
  - pf_welcome_paragraph
  - pf_font_guidance
  - pf_usage_tip_1
  - pf_usage_tip_2
  - pf_more_detail_gate
  - pf_scope_variety
  - pf_provenance_basis
  - pf_design_rationale
  - pf_canonical_order
  - pf_script_glossary
  - pf_example_words
  - pf_troubleshooting
  - pf_related_keyboards
  - pf_known_limitations
  - pf_further_reading
  - pf_project_url
  - pf_credits
  - pf_contact_info
