# s02-deadkey-single-tap.yaml
# Recognizer rule: lift a single-tap deadkey family from an imported KeyboardIR
# into a Pattern instance with origin='recognized'.
#
# Strategy: S-02 (deadkey composition). This is the most common pattern in the
# Latin release/ corpus (12/20 scanned keyboards; spec §7.5 El Pasifika row).
# The spec §6 worked example is this exact cluster shape.
#
# Format: provisional — see README.md. Pending ratification at issue #232.

id: deadkey-single-tap
strategyId: S-02
patternRef: content/patterns/desktop-input/deadkey-single-tap.yaml   # repo-root-relative
format_status: provisional

description: >
  Detect a deadkey composition cluster in a KeyboardIR and lift it into the
  deadkey-single-tap Pattern. The cluster consists of:
    (1) a trigger rule: one keystroke (vkey, character literal, or any() over
        a single-character store) sets a named deadkey state,
    (2) a fan-out rule: the deadkey state plus any() base from a store maps to
        index() output from a parallel store,
    (3) an escape rule (OPTIONAL): the deadkey state plus the trigger key
        emits the bare accent character.
  A family is keyed by (fan-out group, deadkey id, prefix character, base
  store, output store) — one deadkey id may carry several families, and the
  rules of a family need not share a group: triggers live in a 'using keys'
  group, fan-out and escape in the fan-out's group. A postfix family (a
  literal prefix character before the deadkey in the fan-out context) is
  self-triggering: the prefix character is its trigger identity, and no
  trigger rule need exist. Shape checks run on the context with the codec's
  '+' separator elements removed; index() offsets count positions in that
  cleaned context. (Generalised in #2233 — before it, both shipped matchers
  found zero families on sil_euro_latin and sil_pan_africa_mnemonic.)

# ---------------------------------------------------------------------------
# IR predicate
# ---------------------------------------------------------------------------
predicate:
  cluster_type: three-rule-deadkey
  shared_key: deadkey.id   # Roles share the numeric deadkey id; the FAMILY key is
                           # (group, deadkey id, prefix char, S_bases, S_output)

  rules:
    # Rule 1 — trigger rule: arm the deadkey state
    - role: trigger
      description: >
        Pressing a single keystroke (no prior state) outputs a deadkey marker.
        This is the "arm" rule — it does not emit a visible character. Three
        keystroke forms occur in the corpus: a vkey ([K_X]), a character
        literal ("x"), and any() over a store holding exactly one character
        (sil_pan_africa: + any(K_1) > dk(1) with K_1 = "["). An any() over a
        multi-item store is a set selector, not a trigger. The trigger rule
        must live in a 'using keys' group. A postfix family has no trigger
        rule at all — it is self-triggering via its prefix character.
      context_pattern:
        # Cleaned context (codec '+' separators removed) is exactly one element:
        # a vkey, a char, or an any() over a single-character store.
        - kind: vkey
          count: zero_or_one   # one of the three alternative keystroke forms
          constraints:
            no_modifiers_required: false   # modifiers like SHIFT are allowed
            no_prior_deadkey: true         # context must NOT already contain a deadkey
      output_pattern:
        - kind: deadkey
          count: exactly_one
          constraints:
            id: DK   # This id becomes the shared_key for the other two rules

    # Rule 2 — fan-out rule: deadkey + any base -> index output
    - role: fan-out
      description: >
        The deadkey state followed by any base letter (from a parallel store)
        produces the corresponding accented letter (via index into the output store).
        Two cleaned-context forms: the classic [deadkey, any] and the postfix
        [char, deadkey, any] (sil_euro_latin: "x" dk(1) + any(K) > index(O, 3)),
        where the leading char is the family's prefix character. The output
        must be exactly one index() element — a fan-out whose output carries
        additional elements (e.g. a use() group transition) is not S-02.
      context_pattern:
        - kind: deadkey
          count: exactly_one
          constraints:
            id: DK   # Must match the trigger rule's deadkey id
        - kind: any
          count: exactly_one
          constraints:
            storeRef: S_bases   # Names the bases store (see store_constraints)
      output_pattern:
        - kind: index
          count: exactly_one
          constraints:
            storeRef: S_output   # Names the output store (see store_constraints)
            # offset must equal the 1-indexed position of the any() element in the
            # CLEANED context (codec '+' separators removed — the '+' is keystroke
            # punctuation, not a context position; Keyman's own index() definition).
            # Classic form: any() is at position 2. Postfix form: position 3.
            # The engine must verify: index.offset == (1-indexed cleaned position
            # of any()) rather than hardcoding either value.
            offset_equals_any_position: true

    # Rule 3 — escape rule: deadkey + trigger key -> bare combining accent
    - role: escape
      optional: true   # Owned when present; recognition does NOT require it (#2233).
                       # basic_kbdfr ships no escape rules at all — the bare accent is
                       # slot 0 of its fan-out stores. A beep rule is a fallback, never
                       # cluster evidence.
      description: >
        The deadkey state followed by the trigger keystroke emits the bare
        accent character, allowing the trigger character itself to be typed.
        Classic cleaned form: [deadkey, vkey|char] > [char]. Postfix cleaned
        form: [char(X), deadkey, char(X)] > [char(X)] where X is the family's
        prefix character (the three-way equality is definitional). An escape
        matched by several families is recorded on each (for its accentChar)
        and owned by none.
      context_pattern:
        # Classic form (shown): [deadkey, vkey|char]. The second element may be
        # a vkey or a character literal; equality with the trigger rule's
        # keystroke is NOT enforced (keyboards ship escapes whose keystroke
        # differs from every trigger). Postfix form: [char(X), deadkey,
        # char(X)] with the output char also equal to X.
        - kind: deadkey
          count: exactly_one
          constraints:
            id: DK   # Must match the family's deadkey id
        - kind: vkey
          count: exactly_one
          constraints:
            same_as_trigger_rule_vkey: false   # Not enforced — see note above
      output_pattern:
        - kind: char
          count: exactly_one
          constraints:
            single_codepoint: true   # The bare accent, e.g. U+0301

  store_constraints:
    # The ONLY binding store constraint is the parallel-length invariant.
    # There is deliberately no items_kind restriction (#2233, ruling D6): real
    # families' stores carry deadkey items (two-level chain idiom, e.g.
    # basic_kbdrum, sil_cameroon) and raw "nul" padding (sil_cameroon,
    # sil_akebu). An earlier char-only guard here would have un-matched 9
    # families the shipped matchers already found. Slot strings built from
    # such stores keep only their char items (store_items_to_char_string) —
    # a known slot-fidelity limitation; the carve splice is positional on
    # the real stores, so recognition is unaffected.
    - store: S_bases
      isSystem: false
    - store: S_output
      isSystem: false
      same_length_as: S_bases   # Layer A parallel-store invariant — enforced by validator

  group_constraints:
    usingKeys: true             # Applies to the TRIGGER rule's group (the keystroke
                                # position only exists there); fan-out/escape groups
                                # are unconstrained
    all_rules_same_group: false # Triggers, fan-outs and escapes routinely live in
                                # different groups (basic_kbdfr: triggers in main,
                                # fan-outs in a deadkeys group; sil_pan_africa: all
                                # roles in one 'using keys' group)

  disqualifiers:
    - Any rule in the cluster has output element kind=raw (unparsed fragment — cannot safely lift)
    - A context under test contains a raw element other than the codec '+' separator (the rule's true shape is unknown — e.g. platform(...) tokens stay unclaimed)
    - The two stores have different item counts (parallel-store invariant violated — Layer A bug)
    - The fan-out output is not exactly one index() element (e.g. [index, use] is two-mechanism behaviour, not S-02)
    - IRRule.ownedByPattern is already set on any rule in the cluster (already claimed)

  combinedWith_if:
    # El Pasifika §7.5 regression row: the S-02 + S-10 combination is driven by
    # A6=loud (a survey axis), NOT by mechanical presence of a beep in the IR.
    # A defensive or stale beep in an escape rule does NOT imply the keyboard
    # author intended constraint-feedback behavior. The recognizer must NOT
    # silently add S-10 — instead it should set a flag for human review.
    - condition:
        any_rule_in_group:
          output_has_element: { kind: beep }
      action: flag_for_human_review   # Human confirms A6=loud before S-10 is added
      note: >
        Do not automatically assign combinesWith: ["S-10"]. Surface a review
        annotation on the lifted Pattern so the author can confirm whether the
        beep is intentional constraint feedback (A6=loud → S-10) or incidental.

# ---------------------------------------------------------------------------
# What gets lifted
# ---------------------------------------------------------------------------
lifts_to:
  origin: recognized
  patternId: deadkey_single_tap

  # How to populate Pattern slot values from the matched IR cluster.
  # After lifting, the user can refine these values in the survey.
  slot_mapping:
    triggerKey:
      source: rules[trigger].context_pattern[0].name   # The vkey name, e.g. "K_QUOTE"
      transform: none

    deadkeyName:
      source: rules[trigger].output_pattern[0].id   # The deadkey numeric id, DK
      transform: numeric_id_to_label   # underscore-hex label, e.g. 0x0060 -> "dk_0060" (matches the hand-written S-02 rule)

    baseLetters:
      source: stores[S_bases].items
      transform: store_items_to_char_string   # Concatenate all char items into a string

    accentedForms:
      source: stores[S_output].items
      transform: store_items_to_char_string

    accentChar:
      source: rules[escape].output_pattern[0].value   # The bare combining char

# ---------------------------------------------------------------------------
# Corpus evidence
# ---------------------------------------------------------------------------
# Required by issue #240 AC: each rule must be validated against at least two
# release/basic/ or SIL Latin keyboards before this rule is considered complete.
# 'recognizedRatio_delta' values are TARGET estimates pending engine (#234).

corpus_evidence:
  keyboards:
    - id: sil_euro_latin
      path: release/sil/sil_euro_latin/source/sil_euro_latin.kmn
      notes: >
        19 families, ALL in the postfix form ("x" dk(1) + any(K) > index(O, 3))
        sharing the single deadkey dk(1), keyed by prefix character + store
        pair, each with a postfix escape ("x" dk(1) + "x" > "x"). There is NO
        typed trigger rule — the arming rules sit behind if() guards and the
        families are self-triggering. (Corrected in #2233: this keyboard was
        previously described as canonical three-rule clusters; the shipped
        matchers in fact found zero families on it.)
    - id: sil_pan_africa_mnemonic
      path: release/sil/sil_pan_africa_mnemonic/source/sil_pan_africa_mnemonic.kmn
      notes: >
        5 families (dk(1) x2 store pairs, dk(2) x3), all roles in one 'using
        keys' group. Triggers are any() over single-character stores
        (+ any(K_1) > dk(1), K_1 = "["); the shared triggers serve several
        families and are owned by none. No escape rules. A sixth dk(1) body
        with output [index, use] is correctly NOT claimed.
    - id: basic_kbdfr
      path: release/basic/basic_kbdfr/source/basic_kbdfr.kmn
      notes: >
        French keyboard. Bracket key as circumflex prefix. Uses virtual-key trigger
        (K_LBRKT) rather than string-literal trigger, which tests that the trigger
        rule's context_pattern handles both forms.
    - id: sil_cameroon_qwerty
      path: release/sil/sil_cameroon_qwerty/source/sil_cameroon_qwerty.kmn
      notes: >
        Cameroon QWERTY. Colon as diacritic prefix for Cameroonian General Alphabet
        characters. Secondary S-02 in an S-08-primary keyboard — tests that the
        recognizer correctly lifts S-02 clusters even when S-08 is the primary strategy.

  expected_recognizedRatio_min: 0.6   # Target after S-02 rules land (pending #234)

# ---------------------------------------------------------------------------
# Notes for km-domain review
# ---------------------------------------------------------------------------
notes:
  linguistic: >
    The escape rule (trigger-key double-tap) is critical for correct linguistic
    behavior — without it the trigger character itself cannot be typed. The
    escape rule's output is the trigger character's own Unicode identity, which
    may be a combining diacritic (e.g. U+0301 COMBINING ACUTE ACCENT), a spacing
    modifier letter (e.g. U+02BC MODIFIER LETTER APOSTROPHE), or ordinary
    punctuation (e.g. U+0027 APOSTROPHE) depending on the keyboard's design. It
    is NOT always a combining mark. Keyboards that use apostrophe as a deadkey
    trigger (common for glottal stops and modifier letters in African and Pacific
    orthographies) emit plain U+0027 from the escape rule, not a combining
    character. The escape rule must be present for linguistically complete
    S-02 behavior; recognition does not require it (#2233) — keyboards such as
    basic_kbdfr ship no escape rule and carry the bare accent as slot 0 of the
    fan-out stores instead.

  edge_cases:
    - >
      Some keyboards use string-literal context (e.g. "'" > deadkey(acute)) rather
      than a virtual-key context (+ [K_QUOTE] > deadkey(acute)). The predicate must
      handle both ContextElement shapes.
    - >
      A keyboard may define multiple S-02 families (e.g. acute + grave + circumflex).
      Families are keyed by (group, deadkey id, prefix character, base store,
      output store): one deadkey id may carry several families (sil_euro_latin's
      19 families all share dk(1)), told apart by prefix character and store
      pair. The recognizer lifts each family as a separate Pattern instance.
    - >
      If index().offset does not equal the 1-indexed position of the any() element in the fan-out rule's context, this is an unusual pattern that should not be silently lifted — do not assume offset is always 2.
