# s07-diacritic-cycling.yaml
# Recognizer rule: lift a diacritic-cycling (telex-style) apply/cancel pair
# from an imported KeyboardIR into a Pattern instance with origin='recognized'.
#
# Strategy: S-07 (diacritic cycling). A tone key pressed after a plain vowel
# applies a tone mark positionally (any(plain) + "s" > index(marked, 1));
# the same key pressed after the marked vowel cancels the tone and types
# itself (any(marked) + "s" > index(plain, 1) "s") — the cancel rule is the
# defining member of the pair (spec §7.3 S-07 card, vietnamese_telex).
#
# Scope of THIS rule (issue #2212, km-lead ruling): the strict cancel form
# only — output exactly [index(counterpart store, 1), char] where the char
# equals the trigger char, on an UNGUARDED rule. Neighbouring shapes are
# deliberately NOT claimed:
#   - the guarded and/or literal enumeration that makes up the bulk of
#     vietnamese_telex (~72k rules): literal multi-char contexts/outputs,
#     largely under if() guards — a clustering problem beyond per-rule
#     predicate scope, and spec 103 FR-007 forbids claiming guarded rules
#     without an explicit pattern opt-in this rule does not make;
#   - cross-tone swap rules (any(vowels_sac) + 'f' > index(vowels_huyen, 1)):
#     a swap belongs to two tone families at once; claiming it would
#     entangle clusters;
#   - generic [index, char] diacritic-add rules (e.g. fv_* index(HasMac,1)
#     U+0301): the output char there is not the trigger char — the
#     trigger-equality condition below is what keeps them out (without it
#     this shape would match ~1,769 rules across 143 keyboards).
#
# Format: provisional — see README.md.

id: diacritic-cycling
strategyId: S-07
patternRef: content/patterns/desktop-input/diacritic-cycling.yaml   # repo-root-relative
format_status: provisional

description: >
  Detect a diacritic-cycling cluster in a KeyboardIR and lift it into the
  diacritic_cycling Pattern. A cluster is one cancel rule in a single
  IRGroup — any(marked store) followed by one literal cycle-key character,
  emitting index(plain store, 1) and then the cycle-key character itself —
  plus, when present in the same group, its paired apply rule (any(plain
  store) + the same cycle key > index(marked store, 1)). Clusters are keyed
  by (group, marked store, plain store, cycle key): one tone family in one
  case is one cluster (vietnamese_telex carries ten: five tones × two
  cases). The codec may preserve the inline "+" as a raw context element;
  the engine ignores that element when matching.

# ---------------------------------------------------------------------------
# IR predicate
# ---------------------------------------------------------------------------
predicate:
  cluster_type: diacritic-cycling
  shared_key: stores   # Rules cluster by (IRGroup, marked store, plain store, cycle key)

  rules:
    - role: cancel
      description: >
        The defining rule: a marked vowel (any() over the marked store)
        followed by the cycle key collapses back to the positionally
        corresponding plain vowel (index() into the plain store) and the
        cycle key is re-emitted literally, so the keypress is not lost.
      context_pattern:
        # No leading if() guards: guardCount must be 0 (spec 103 FR-007 —
        # this pattern does not opt in to claiming guarded rules).
        - kind: any
          count: exactly_one
          constraints:
            storeRef: S_marked   # Names the marked store (see store_constraints)
        # The codec may interpose a raw "+" element between the any() and
        # this char (source-form artifact); it is not part of the shape.
        - kind: char
          count: exactly_one   # The cycle key, e.g. "s" (telex) or "1" (VNI)
      output_pattern:
        - kind: index
          count: exactly_one
          constraints:
            storeRef: S_unmarked   # Names the plain store (see store_constraints)
            # offset must equal the 1-indexed position of the any() element
            # in context. Guards are excluded by this rule, so the offset
            # is always 1 — the same guard-adjusted invariant the S-03 rule
            # pins (spec 103), at guardCount 0.
            offset_equals_any_position: true
        - kind: char
          count: exactly_one
          constraints:
            # The re-emitted character must equal the context trigger
            # character. This equality is the boundary against generic
            # [index, char] diacritic-add rules.
            same_as_trigger_char: true

    - role: apply
      description: >
        The paired rule, attached to the cluster when present in the same
        group: a plain vowel (any() over the plain store) followed by the
        same cycle key produces the positionally corresponding marked
        vowel. A cluster forms on the cancel rule alone if no apply rule
        is present (or if the apply rule is already owned, e.g. lifted
        as S-03 by an earlier recognizer pass).
      context_pattern:
        - kind: any
          count: exactly_one
          constraints:
            storeRef: S_unmarked
        - kind: char
          count: exactly_one   # Same cycle key as the cancel rule
      output_pattern:
        - kind: index
          count: exactly_one
          constraints:
            storeRef: S_marked
            offset_equals_any_position: true

  store_constraints:
    - store: S_marked
      isSystem: false
      items_kind: char   # All items must be char; no vkey, deadkey, or raw items
    - store: S_unmarked
      isSystem: false
      items_kind: char
      same_length_as: S_marked   # Parallel-store invariant

  group_constraints:
    all_rules_same_group: true  # All rules of one cluster share an IRGroup

  disqualifiers:
    - IRRule.ownedByPattern is already set on a rule (already claimed)
    - The rule carries any leading if() guard (spec 103 FR-007 — guarded rules are not claimed by this pattern)
    - The output char does not equal the context trigger char (generic diacritic-add — not a cancel)
    - The index() target store equals the context any() store (no counterpart store — not a cycle pair)
    - index() offset does not equal the any() element's context position (1, guards excluded)
    - The marked or plain store does not resolve in the IR (unresolved refs are no evidence, never a pass)
    - Any element of the rule is kind=raw other than the codec's inline "+" separator (unparsed fragment — cannot safely lift)

  combinedWith_if: []   # S-07 asserts no combination by itself

# ---------------------------------------------------------------------------
# What gets lifted
# ---------------------------------------------------------------------------
lifts_to:
  origin: recognized
  patternId: diacritic_cycling

  # Slot ids mirror content/patterns/desktop-input/diacritic-cycling.yaml.
  slot_mapping:
    plainChars:
      source: stores[S_unmarked].items
      transform: store_items_to_char_string   # Concatenate all char items into a string

    markedChars:
      source: stores[S_marked].items
      transform: store_items_to_char_string

    cycleKey:
      source: rules[cycle].trigger_chars   # The cluster's cycle key (one char; every cancel rule in the cluster shares it)
      transform: none

    cycleStoreName:
      source: null   # Cannot be inferred from IR — user fills in survey

# ---------------------------------------------------------------------------
# Corpus evidence
# ---------------------------------------------------------------------------
# Required by issue #240 AC: each rule must be validated against at least two
# release/ keyboards before this rule is considered complete. This rule is
# validated against THREE named keyboards below, and a full release-corpus
# scan (933 .kmn, keymanapp/keyboards @ 435f82d6) found the strict form in
# 17 keyboards / 133 rules with no opaque-risk rules among them (scan +
# codec-parser verification, issue #2212 ruling): vietnamese_telex,
# vietnamese_telex_legacy, vietnamese_vni, taigi_viet_telex, taigi_telex,
# taigi_sdwxv, foochow, teochew, rawang, hainam, hakka, nguphing,
# sil_tepehuan, taichow, cantonese_telex, vietnam, gff_ethiopic.
# CORRECTION (real-matcher validation, #2212): gff_ethiopic's scan hit is
# any(arabNumbersWithZero) + ',' > index(arabNumbersWithZero, 1) ',' — an
# identity re-emission into the SAME store, which this rule deliberately
# does not claim (a cycle needs two counterpart stores). The verified
# witness set is therefore 16 keyboards; four were validated end-to-end
# with the real matcher (vietnamese_telex 10 clusters, vietnamese_vni 5,
# vietnamese_telex_legacy 10, taigi_telex 12).
# HONEST COVERAGE NOTE: in vietnamese_telex the landed form is 10 cancel
# rules (plus their 10 paired applies) out of ~72,000 rules — the dominant
# telex cancel/cycle behaviour is literal enumeration and is NOT claimed
# by this rule (see header). The ratio below is stated accordingly.

corpus_evidence:
  keyboards:
    - id: vietnamese_telex
      path: release/v/vietnamese_telex/source/vietnamese_telex.kmn
      notes: >
        The canonical S-07 exemplar (spec §7.3 card, §7.5 row). Ten strict
        cancel rules (lines 61-62, 74-75, 87-88, 100-101, 113-114): five
        tones (sac 's', huyen 'f', hoi 'r', nga 'x', nang 'j') × two cases,
        each with its paired apply rule. The file parses to 72,222 typed
        rules with 0 opaque at the S-03 base (codec verification, #2212).
    - id: vietnamese_vni
      path: release/v/vietnamese_vni/source/vietnamese_vni.kmn
      notes: >
        The digit-key variant: any(vowels_sac) + '1' > index(vowels, 1) '1'
        (line 52) and its four sibling tones. Same stores, same pair shape;
        validates that the cycle key is an arbitrary literal char, not a
        letter-only assumption.
    - id: vietnamese_telex_legacy
      path: release/v/vietnamese_telex_legacy/source/vietnamese_telex_legacy.kmn
      notes: >
        Legacy twin of vietnamese_telex carrying the same ten strict cancel
        rules; an independent file-level witness of the same mechanism.

  expected_recognizedRatio_min: 0.0002   # vietnamese_telex: ~20 claimed rules of ~72,000 — the form is a sliver by design (see coverage note)

# ---------------------------------------------------------------------------
# Notes for km-domain review
# ---------------------------------------------------------------------------
notes:
  linguistic: >
    The cycle key is a real character key with a second job: it applies a
    tone after a plain vowel, and after a marked vowel it cancels the tone
    and types itself — so doubling the key is the author's escape hatch and
    no keypress is ever swallowed. This is what distinguishes S-07 from a
    deadkey (S-02: the first keystroke commits nothing) and from S-03 (the
    trigger collapses a pair into a different character and is not
    re-emitted).

  edge_cases:
    - >
      Cross-tone swap rules (any(vowels_sac) + 'f' > index(vowels_huyen, 1))
      share the apply shape with a different target store. They are not
      claimed: a swap belongs to two tone families at once. A keyboard
      whose ONLY cycling rules are swaps lifts nothing under this rule.
    - >
      Case variants are separate clusters ('s' and 'S' over the same store
      pair): the stores are shared nodes between the two lifted Patterns,
      which is expected and must not trip ownership checks (stores carry
      no ownedByPattern) — the same situation as sil_ipa's reverse pair
      under S-03.
    - >
      An apply rule may already be owned when this rule runs (the S-03
      recognizer can claim an unguarded parallel-store apply rule as
      sequence-replace). The cancel cluster still forms; the apply rule is
      simply not attached. Cluster formation never depends on the apply
      rule's availability.
