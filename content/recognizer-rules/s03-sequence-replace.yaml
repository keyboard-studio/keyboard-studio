# s03-sequence-replace.yaml
# Recognizer rule: lift a sequence-replace rule family from an imported
# KeyboardIR into a Pattern instance with origin='recognized'.
#
# Strategy: S-03 (sequence replace). A base character is typed first and
# remains visible; a following trigger character collapses the pair into a
# marked form via a parallel-store index() lookup (spec §7.3 S-03 card).
# The canonical exemplar is sil_ipa (IPA suffixes <, =, >, ^, |, _).
#
# Scope of THIS rule (issue #342, km-lead ruling): the parallel-store form
# only — any(S_bases) + "<trigger>" > index(S_output, n). Two neighbouring
# shapes are deliberately NOT claimed:
#   - the digraph form ('n' + 'g' > 'ŋ', athinkra_vai; pattern
#     multi_char_sequence): literal char output, no store linkage — it
#     groups like S-01, not like this rule, and needs its own design;
#   - the vkey-trigger form (any(composed) + [K_BKSP] > index(comp-dia,1),
#     sil_cameroon_qwerty / sil_cameroon_azerty / pid_piaroa): whether a
#     BKSP/RALT trigger is the same strategy is an open domain question,
#     filed as a follow-on — the production A3a detector
#     (strategy-selector/import-mark-order.ts) narrows to char triggers too.
#
# Format: provisional — see README.md.

id: sequence-replace
strategyId: S-03
patternRef: content/patterns/desktop-input/context-sensitive-substitution.yaml   # repo-root-relative
format_status: provisional

description: >
  Detect a sequence-replace cluster in a KeyboardIR and lift it into the
  context-sensitive-substitution Pattern. Each cluster is one or more rules
  in a single IRGroup sharing one (base store, output store) pair, of the
  form: an optional leading if() guard cluster, then any(base store), then
  one literal trigger character, emitting index(output store, n) where n is
  the 1-based position of the any() element in the context (leading guards
  count — the guarded sil_ipa form has n = 2). The codec may preserve the
  inline "+" as a raw context element; the engine ignores that element when
  matching, exactly as the production detector does.

# ---------------------------------------------------------------------------
# IR predicate
# ---------------------------------------------------------------------------
predicate:
  cluster_type: sequence-replace
  shared_key: stores   # Rules cluster by (IRGroup, base store, output store)

  rules:
    # The only role — each rule in the cluster has this same shape; the
    # cluster's multiplicity lives in the parallel stores, not in rule count
    # (sil_ipa carries exactly one rule per store pair).
    - role: single
      description: >
        A sequence-replace rule: previously typed base character (any() over
        the base store) followed by one literal trigger character collapses
        to the positionally corresponding marked form (index() into the
        output store).
      context_pattern:
        # Zero or more spec-103 typed guards (kind:"if") in head position.
        # A guard is a qualifier on the rule, never an S-11 signal: most
        # corpus guards test option stores driven from outside the file.
        - kind: if
          count: zero_or_one   # one in every attested form; the engine counts all leading guards
          constraints:
            storeRef: guard_store   # e.g. option_key in sil_ipa
        - kind: any
          count: exactly_one
          constraints:
            storeRef: S_bases   # Names the base store (see store_constraints)
        # The codec may interpose a raw "+" element between the any() and
        # this char (source-form artifact); it is not part of the shape.
        - kind: char
          count: exactly_one   # The literal trigger character, e.g. "="
      output_pattern:
        - kind: index
          count: exactly_one
          constraints:
            storeRef: S_output   # Names the output store (see store_constraints)
            # offset must equal the 1-indexed position of the any() element
            # in context, counting leading if() guards (unguarded: 1;
            # sil_ipa guarded form: 2). Mirrors the invariant the codec and
            # the production A3a detector already pin (spec 103).
            offset_equals_any_position: true

  store_constraints:
    - store: S_bases
      isSystem: false
      items_kind: char   # All items must be char; no vkey, deadkey, or raw items
    - store: S_output
      isSystem: false
      items_kind: char
      same_length_as: S_bases   # Parallel-store invariant

  group_constraints:
    all_rules_same_group: true  # All rules of one cluster share an IRGroup

  disqualifiers:
    - IRRule.ownedByPattern is already set on a rule (already claimed)
    - The base or output store does not resolve in the IR (unresolved refs are no evidence, never a pass)
    - Unguarded form whose store pair is NOT a genuine base→marked remap (positional pairs related by decomposition-with-added-marks or by Unicode name extension — the production detector's standard; shape alone would claim any parallel-store remap, S-04/S-05 territory)
    - index() offset does not equal the any() element's context position counting leading guards
    - Trigger element is a vkey, not a literal char (vkey-trigger near-shape — not claimed, see header)
    - First context element (after guards) is not any() (literal-char first element is the digraph form — not claimed, see header)
    - Any rule in the cluster has output element kind=raw (unparsed fragment — cannot safely lift)

  combinedWith_if: []   # S-03 asserts no combination by itself (the pattern declares combinesWith S-04/S-05)

# ---------------------------------------------------------------------------
# What gets lifted
# ---------------------------------------------------------------------------
lifts_to:
  origin: recognized
  patternId: context_sensitive_substitution

  # Slot ids mirror content/patterns/desktop-input/context-sensitive-substitution.yaml.
  slot_mapping:
    contextChars:
      source: stores[S_bases].items
      transform: store_items_to_char_string   # Concatenate all char items into a string

    contextOutputs:
      source: stores[S_output].items
      transform: store_items_to_char_string

    triggerChar:
      source: rules[sequence].trigger_chars   # Distinct literal trigger chars of the cluster, first-appearance order
      transform: none

    contextStoreName:
      source: null   # Cannot be inferred from IR — user fills in survey

    defaultOutput:
      source: null   # What the trigger produces with no context char — not present in the cluster; user fills in survey

# ---------------------------------------------------------------------------
# Corpus evidence
# ---------------------------------------------------------------------------
# Required by issue #240 AC: each rule must be validated against at least two
# release/ keyboards before this rule is considered complete. HONEST STATUS
# (issue #342 ruling addendum): a full-corpus scan (release + legacy +
# experimental) found the char-trigger form in exactly ONE keyboard —
# sil_ipa. sil_ipa carries at least six independent store-pair clusters for
# this rule (equal, great, less, hat, pipe, subscript), in both the guarded
# (offset 2) and unguarded (offset 1) forms, so the finder is validated
# against six real clusters, not one rule. The vkey-trigger near-shape
# keyboards below are recorded as context, NOT as validation of this rule:
# this rule does not claim their shapes.

corpus_evidence:
  keyboards:
    - id: sil_ipa
      path: release/sil/sil_ipa/source/sil_ipa.kmn
      notes: >
        The canonical S-03 exemplar (spec §7.3 card, §7.5 IPA row). Store
        pairs include equalD/equalU (trigger "="), greatD/greatU (">"),
        lessD/lessU ("<"), hatD/hatU ("^"), pipeD/pipeU ("|"),
        subscriptD/subscriptU ("_"). Each pair appears in an unguarded
        offset-1 form and an if(option_key='')-guarded offset-2 form.
    - id: sil_cameroon_qwerty
      path: release/sil/sil_cameroon_qwerty/source/sil_cameroon_qwerty.kmn
      notes: >
        CONTEXT ONLY — not claimed by this rule. Carries the vkey-trigger
        near-shape: any(composed) + [K_BKSP] > index(comp-dia,1). Recorded
        so the boundary of this rule is explicit; pid_piaroa
        (any(vowel) + [RALT K_COMMA] > index(vowel,1)) is the same
        near-shape family.

  expected_recognizedRatio_min: 0.1   # Estimate for sil_ipa: the S-03 pairs are a subset of its rule inventory

# ---------------------------------------------------------------------------
# Notes for km-domain review
# ---------------------------------------------------------------------------
notes:
  linguistic: >
    The trigger character is typed AFTER the base and stays meaningful on its
    own (it is a literal suffix key, e.g. "=" in IPA transcription); this is
    what distinguishes S-03 from a deadkey (S-02), where the first keystroke
    commits nothing visible. The guarded form (if(option_key='')) is the
    live sil_ipa default: the same pairs also exist unguarded, and both
    forms must lift — a recognizer that only matches the unguarded form
    misses the keyboard's canonical state.

  edge_cases:
    - >
      sil_ipa also contains a REVERSE pair (any(subscriptU) + "_" >
      index(subscriptD,2)): output store of one cluster is the base store
      of another. Each (base, output) pair is its own cluster; sharing a
      store node between two lifted Patterns is expected and must not trip
      the recognizer's ownership checks (stores carry no ownedByPattern).
    - >
      A trigger character may be shared across pairs ("_" serves both
      subscript directions). Clusters key on the store pair, never on the
      trigger char alone.
    - >
      Guarded rules qualify on shape + offset alone (production-detector
      standard): the live sil_ipa pairs do not all pass the base→marked
      relation check (B → small-capital B is a name change, not a name
      extension), so applying the relation check to guarded rules would
      silently lose the canonical exemplar.
